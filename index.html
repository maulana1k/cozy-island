<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cozy Island</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%236fcfd0'/%3E%3Cellipse cx='16' cy='19' rx='10' ry='6' fill='%239fd68a'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f6d9b8; }
    #game { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #game:active { cursor: grabbing; }
    .pill {
      position: fixed; left: 50%; transform: translateX(-50%);
      font: 600 15px/1 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
      color: #5b4636; background: rgba(255, 250, 240, 0.86);
      padding: 10px 18px; border-radius: 999px;
      box-shadow: 0 4px 18px rgba(90, 60, 30, 0.18);
      pointer-events: none; user-select: none; white-space: nowrap;
      transition: opacity 0.35s ease;
    }
    #hint { bottom: 28px; font-size: 13px; font-weight: 500; }
    #prompt { bottom: 76px; opacity: 0; }
    .hidden { opacity: 0 !important; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="prompt" class="pill"></div>
  <div id="hint" class="pill hidden"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
