<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scout Camp Island</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%236fcfd0'/%3E%3Cellipse cx='16' cy='19' rx='10' ry='6' fill='%239fd68a'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #2b3440; --gold: #ffd24a; --accent: #2f9e6f;
      --shade: 0 1px 2px rgba(20, 20, 30, 0.55), 0 0 10px rgba(20, 20, 30, 0.28);
      --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, sans-serif;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8f2; }
    #game { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #game:active { cursor: grabbing; }
    #prompt, #hint { display: none; }

    /* During play: white words and line icons straight on the picture, no panels. */
    #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; font: 600 15px/1.3 var(--font); text-shadow: var(--shade); letter-spacing: 0.2px; }
    #hud button { font: inherit; color: inherit; cursor: pointer; pointer-events: auto; background: none; border: 0; padding: 0; text-shadow: inherit; letter-spacing: inherit; }
    #hud svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; display: block; filter: drop-shadow(0 1px 2px rgba(20, 20, 30, 0.5)); }
    #hud svg.fill { fill: currentColor; stroke: none; }
    #hud .ico { width: 20px; height: 20px; flex: none; display: inline-block; }
    #hud .gold { color: var(--gold); }
    #hud kbd { font: 800 12px var(--font); color: var(--ink); background: #fff; border-radius: 999px; min-width: 14px; padding: 4px 8px; text-align: center; text-shadow: none; box-shadow: 0 1px 3px rgba(20, 20, 30, 0.35); white-space: nowrap; }
    #hud .tl, #hud .bl, #hud .hints, #hud .toasts { opacity: 0; transition: opacity 0.7s ease; }
    #hud.playing .tl, #hud.playing .bl, #hud.playing .hints, #hud.playing .toasts { opacity: 1; }

    #hud .tl { position: absolute; top: 20px; left: 24px; }
    #hud .rank { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; }
    #hud .rank .ico { width: 24px; height: 24px; }
    #hud .rank .num { font-variant-numeric: tabular-nums; }
    #hud .bar { width: 190px; height: 4px; border-radius: 9px; background: rgba(255, 255, 255, 0.35); margin: 6px 0 9px; overflow: hidden; box-shadow: 0 1px 3px rgba(20, 20, 30, 0.3); }
    #hud .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 9px; transition: width 0.6s cubic-bezier(.2, .9, .3, 1); }
    #hud .line { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; opacity: 0.95; }
    #hud .line .ico { width: 17px; height: 17px; }
    #hud .line .time { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
    #hud .now { margin-top: 5px; font-size: 15px; font-weight: 700; }

    #hud .stats { margin-top: 10px; display: grid; gap: 5px; }
    #hud .stat { display: flex; align-items: center; gap: 8px; }
    #hud .stat .ico { width: 16px; height: 16px; }
    #hud .meter { width: 96px; height: 4px; border-radius: 9px; background: rgba(255, 255, 255, 0.32); overflow: hidden; box-shadow: 0 1px 3px rgba(20, 20, 30, 0.3); }
    #hud .meter i { display: block; height: 100%; width: 50%; background: #fff; border-radius: 9px; transition: width 0.5s ease; }
    #hud .stat.low { color: #ffc2ad; animation: pulse 1.3s ease-in-out infinite; }
    #hud .stat.low .meter i { background: #ff9a7a; }

    /* The belt: what is in the first pockets, one number key each */
    #hud .belt { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 14px; opacity: 0; transition: opacity 0.7s ease; }
    #hud.playing .belt { opacity: 1; }
    #hud .slot { position: relative; width: 46px; height: 52px; display: flex; flex-direction: column; align-items: center; transition: transform 0.15s ease; }
    #hud .slot:hover { transform: translateY(-4px) scale(1.12); }
    #hud .slot .pic { font-size: 30px; line-height: 34px; filter: drop-shadow(0 2px 3px rgba(20, 20, 30, 0.45)); }
    #hud .slot b { position: absolute; right: -2px; top: 18px; font-size: 13px; font-weight: 800; }
    #hud .slot em { font: 800 10px var(--font); font-style: normal; opacity: 0.85; margin-top: 2px; }
    #hud .toast.note { font-size: 16px; }
    #hud .toast .pic { font-size: 22px; filter: drop-shadow(0 2px 3px rgba(20, 20, 30, 0.45)); }

    #hud .bl { position: absolute; left: 24px; bottom: 22px; }
    #hud .ground { display: flex; align-items: center; gap: 7px; font-size: 13px; margin-bottom: 12px; opacity: 0.9; }
    #hud .ground i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff; }
    #hud .tools { display: flex; gap: 16px; align-items: flex-end; }
    #hud .tool { width: 38px; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; opacity: 0.92; transition: transform 0.15s ease, opacity 0.15s ease; }
    #hud .tool svg { width: 34px; height: 34px; }
    #hud .tool em { font: 800 10px var(--font); font-style: normal; opacity: 0.85; }
    #hud .tool:hover { transform: translateY(-3px) scale(1.1) rotate(-3deg); opacity: 1; }
    #hud .tool.active { color: var(--gold); }
    #hud .tool.muted { opacity: 0.45; }
    #hud .tool.muted .waves { display: none; }
    #hud .tool .dot { position: absolute; top: -4px; right: -2px; width: 11px; height: 11px; border-radius: 50%; background: #ff5a4a; box-shadow: 0 0 0 2px #fff; transform: scale(0); transition: transform 0.25s cubic-bezier(.2, 1.6, .4, 1); }
    #hud .tool .dot.on { transform: scale(1); }

    /* Key list, bottom-right: a white key and what it does, on a faint strip */
    #hud .hints { position: absolute; right: 0; bottom: 22px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    #hud .hint { display: flex; align-items: center; gap: 9px; padding: 5px 22px 5px 7px; min-width: 150px; font-size: 14px; font-weight: 700;
      background: linear-gradient(90deg, rgba(70, 48, 34, 0.5), rgba(70, 48, 34, 0.28)); border-radius: 999px 0 0 999px; }
    #hud .hint.strong { background: linear-gradient(90deg, rgba(40, 30, 24, 0.72), rgba(40, 30, 24, 0.45)); font-size: 15px; }

    #hud .toasts { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; }
    #hud .toast { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 800; animation: pop 0.45s cubic-bezier(.2, 1.5, .4, 1); transition: opacity 0.5s ease, transform 0.5s ease; }
    #hud .toast .ico { width: 24px; height: 24px; animation: spin 0.7s cubic-bezier(.2, 1.3, .4, 1); }
    #hud .toast .count { font-size: 12px; opacity: 0.85; }
    #hud .toast.out { opacity: 0; transform: translateY(-10px); }
    @keyframes pop { from { opacity: 0; transform: translateY(-14px) scale(0.85); } to { opacity: 1; transform: none; } }
    @keyframes spin { from { transform: rotate(-120deg) scale(0.2); } to { transform: none; } }

    #hud .banner { position: absolute; top: 17%; left: 50%; transform: translate(-50%, -16px); opacity: 0; text-align: center; transition: opacity 0.5s ease, transform 0.6s cubic-bezier(.2, 1.3, .4, 1); }
    #hud .banner.show { opacity: 1; transform: translate(-50%, 0); }
    #hud .banner .big { font-size: 40px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; }
    #hud .banner i { display: block; width: 190px; height: 4px; border-radius: 4px; background: #fff; margin: 8px auto 10px; box-shadow: 0 1px 3px rgba(20, 20, 30, 0.4); }
    #hud .banner .small { font-size: 16px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }

    /* Speech bubble */
    #hud .bubble { position: absolute; left: 0; top: 0; background: #fff; color: var(--ink); text-shadow: none; padding: 20px 22px 16px; border-radius: 26px; min-width: 150px; max-width: 280px; text-align: center;
      font-size: 16px; font-weight: 600; box-shadow: 0 6px 18px rgba(20, 30, 50, 0.22); opacity: 0; transition: opacity 0.25s ease; }
    #hud .bubble.show { opacity: 1; }
    #hud .bubble::after { content: ""; position: absolute; left: 50%; bottom: -11px; margin-left: -9px; border: 10px solid transparent; border-top-color: #fff; border-bottom: 0; }
    #hud .bubble .who { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: #7fb0d6; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; padding: 4px 14px; border-radius: 9px; white-space: nowrap; }

    /* Things you hold up: the notebook and the map */
    #hud .sheet { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: auto; background: rgba(30, 40, 60, 0.18); transition: opacity 0.3s ease; text-shadow: none; }
    #hud .sheet.off { opacity: 0; pointer-events: none; }
    #hud .sheet.off .page, #hud .sheet.off .paper, #hud .sheet.off .rings { transform: translateY(60px) rotate(4deg); }
    #hud .book { grid-template-columns: auto; }
    #hud .page { position: relative; width: min(92vw, 470px); height: min(86vh, 660px); background: #fffdf8; color: var(--ink); border-radius: 8px 22px 22px 8px; padding: 26px 30px 16px 62px; box-sizing: border-box;
      display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(20, 30, 50, 0.35); transform: rotate(-1.5deg); transition: transform 0.4s cubic-bezier(.2, 1.2, .3, 1);
      background-image: linear-gradient(90deg, transparent 44px, #dbe9f4 44px, #dbe9f4 46px, transparent 46px); }
    #hud .rings { position: absolute; left: calc(50% - min(46vw, 235px) - 14px); top: 50%; height: min(78vh, 600px); transform: translateY(-50%) rotate(-1.5deg); display: flex; flex-direction: column; justify-content: space-between; z-index: 2; transition: transform 0.4s cubic-bezier(.2, 1.2, .3, 1); }
    #hud .rings i { width: 44px; height: 9px; border-radius: 9px; background: linear-gradient(#d9dde2, #9aa3ad); box-shadow: 0 2px 3px rgba(20, 30, 50, 0.3); }
    #hud .page h2 { margin: 0; font-size: 28px; font-weight: 800; }
    #hud .page .head p { margin: 4px 0 10px; font-size: 13px; color: #6a7684; }
    #hud .lists { flex: 1; overflow-y: auto; padding-right: 6px; }
    #hud .lists h3 { display: flex; justify-content: space-between; margin: 14px 0 2px; font-size: 13px; font-weight: 800; letter-spacing: 0.9px; text-transform: uppercase; color: #7fb0d6; }
    #hud .item { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1.5px solid #e6edf3; }
    #hud .item .mark { width: 24px; height: 24px; border-radius: 50%; background: #eef2f6; flex: none; padding: 3px; box-sizing: border-box; color: #f5b301; }
    #hud .item .mark svg { filter: none; }
    #hud .item .label { font-weight: 700; font-size: 15px; }
    #hud .item .tip { font-size: 12px; color: #8a95a3; font-weight: 500; }
    #hud .item.done .tip { color: var(--accent); font-weight: 700; }
    #hud .item:not(.done) .label { color: #5d6875; }
    #hud .foot { padding-top: 10px; font-size: 12px; color: #8a95a3; font-weight: 500; }
    #hud .paper { background: #fff; padding: 16px; border-radius: 4px; box-shadow: 0 20px 55px rgba(20, 30, 50, 0.4); transform: rotate(1.6deg); transition: transform 0.4s cubic-bezier(.2, 1.2, .3, 1); cursor: pointer; }
    #hud .paper canvas { display: block; width: min(84vh, 84vw, 720px); height: min(84vh, 84vw, 720px); }

    /* Backpack: a canvas flap with stitched pockets */
    #hud .pack { width: min(94vw, 520px); max-height: 90vh; overflow-y: auto; box-sizing: border-box; background: #f4ead2; color: var(--ink); border-radius: 26px 26px 34px 34px; padding: 22px 26px 22px; box-shadow: 0 18px 50px rgba(20, 30, 50, 0.38), inset 0 0 0 6px #f4ead2, inset 0 0 0 8px rgba(150, 110, 70, 0.0);
      outline: 2px dashed rgba(150, 110, 70, 0.55); outline-offset: -11px; transform: rotate(-1deg); transition: transform 0.4s cubic-bezier(.2, 1.2, .3, 1); }
    #hud .sheet.off .pack { transform: translateY(60px) rotate(3deg); }
    #hud .pack .head { display: flex; align-items: baseline; justify-content: space-between; }
    #hud .pack h2 { margin: 0; font-size: 28px; font-weight: 800; }
    #hud .pack .count { font-size: 13px; color: #8a7a62; font-weight: 700; }
    #hud .feel { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; margin: 12px 0 14px; }
    #hud .feel .f { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: #6b5c48; }
    #hud .feel .ico { width: 17px; height: 17px; }
    #hud .feel svg { filter: none; }
    #hud .feel span:nth-child(2) { width: 50px; }
    #hud .feel .meter { flex: 1; width: auto; height: 7px; background: #e2d4b4; box-shadow: none; }
    #hud .feel .meter i { background: #6fae6a; }
    #hud .feel .f.low .meter i { background: #e8704a; }
    #hud .feel b { width: 24px; text-align: right; font-variant-numeric: tabular-nums; }
    #hud .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 9px; }
    #hud .cell { position: relative; aspect-ratio: 1; border-radius: 14px; background: #fffaf0 !important; box-shadow: inset 0 0 0 2px #e2d4b4; display: grid; place-items: center; transition: transform 0.12s ease; }
    #hud .cell.empty { background: transparent !important; box-shadow: inset 0 0 0 2px rgba(150, 110, 70, 0.22); cursor: default; }
    #hud .cell:not(.empty):hover { transform: scale(1.07) rotate(-2deg); }
    #hud .cell.on { box-shadow: inset 0 0 0 3px #e8563f; }
    #hud .cell .pic { font-size: 30px; }
    #hud .cell b { position: absolute; right: 6px; bottom: 3px; font-size: 13px; font-weight: 800; color: var(--ink); }
    #hud .cell em { position: absolute; left: 6px; top: 3px; font: 800 10px var(--font); font-style: normal; color: #b3a283; }
    #hud .detail { margin-top: 14px; min-height: 132px; }
    #hud .detail .top { display: flex; gap: 14px; align-items: center; }
    #hud .detail .big { font-size: 50px; line-height: 1; }
    #hud .detail .kind { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #b08a55; }
    #hud .detail h3 { margin: 1px 0 2px; font-size: 20px; font-weight: 800; }
    #hud .detail p { margin: 0; font-size: 13.5px; font-weight: 500; color: #6b5c48; }
    #hud .detail .none { padding: 26px 8px; text-align: center; }
    #hud .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; min-height: 24px; }
    #hud .chip { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #dff0d8; color: #3f7f4a; }
    #hud .chip.plain { background: #ece0c4; color: #7a6a52; }
    #hud .acts { display: flex; gap: 9px; }
    #hud .act { font-size: 15px !important; font-weight: 800 !important; padding: 9px 18px !important; border-radius: 999px; background: #fffaf0 !important; color: var(--ink) !important; box-shadow: inset 0 0 0 2px #e2d4b4; transition: transform 0.12s ease; }
    #hud .act.main { background: #e8563f !important; color: #fff !important; box-shadow: 0 3px 0 #b83e2c; }
    #hud .act:hover { transform: translateY(-2px); }

    /* Past the rope: red edges and a warning */
    #hud .danger { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s ease; background: radial-gradient(ellipse at center, rgba(120, 10, 0, 0) 42%, rgba(170, 20, 10, 0.62) 100%); }
    #hud .alert { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 0.3s ease; white-space: nowrap; }
    #hud.danger-on .alert { opacity: 1; animation: pulse 0.9s ease-in-out infinite; }
    #hud .alert .big { font-size: 40px; font-weight: 800; letter-spacing: 4px; color: var(--gold); }
    #hud .alert .small { font-size: 17px; font-weight: 800; margin-top: 4px; }

    /* The journey card, top-right */
    #hud .quest { position: absolute; top: 20px; right: 24px; width: 270px; text-align: right; opacity: 0; transition: opacity 0.5s ease; }
    #hud.playing .quest { opacity: 1; }
    #hud .quest.off, #hud.filming .quest { opacity: 0 !important; }
    #hud .quest .qh { font-size: 12px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--gold); }
    #hud .quest .qt { font-size: 21px; font-weight: 800; margin: 1px 0 2px; }
    #hud .quest .qx { font-size: 14px; font-weight: 600; opacity: 0.95; }
    #hud .quest .qk { margin-top: 7px; display: flex; gap: 7px; justify-content: flex-end; align-items: center; font-size: 12px; opacity: 0.8; }
    #hud .way { position: absolute; left: 0; top: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; transition: opacity 0.3s ease; }
    #hud .way i { width: 15px; height: 15px; background: var(--gold); transform: rotate(45deg); border-radius: 3px; box-shadow: 0 0 0 2.5px #fff, 0 2px 6px rgba(20, 20, 30, 0.5); animation: pulse 1.6s ease-in-out infinite; }
    #hud .way.edge i { background: #fff; box-shadow: 0 0 0 2.5px var(--gold), 0 2px 6px rgba(20, 20, 30, 0.5); }
    #hud.filming .way, #hud .quest.off ~ .way { }
    /* One line of help */
    #hud .tip1 { position: absolute; left: 50%; bottom: 112px; transform: translate(-50%, 12px); max-width: min(86vw, 620px); display: flex; gap: 10px; align-items: center; font-size: 16px; font-weight: 700; text-align: left; opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease;
      background: linear-gradient(90deg, rgba(40, 30, 24, 0), rgba(40, 30, 24, 0.55) 12%, rgba(40, 30, 24, 0.55) 88%, rgba(40, 30, 24, 0)); padding: 8px 46px; }
    #hud .tip1.show { opacity: 1; transform: translate(-50%, 0); }
    #hud .tip1 b { font-size: 11px; letter-spacing: 1.5px; color: var(--ink); background: var(--gold); border-radius: 999px; padding: 3px 9px; text-shadow: none; }
    #hud.filming .tip1 { opacity: 0; }
    /* Little films: black bars, a caption, and everything else steps back */
    #hud .cine > div { position: absolute; left: 0; right: 0; height: 0; background: #0d0f14; transition: height 0.6s cubic-bezier(.2, .9, .3, 1); overflow: hidden; }
    #hud .cine .bar-t { top: 0; } #hud .cine .bar-b { bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #hud.filming .cine > div { height: 13vh; }
    #hud .cine .ct { font-size: clamp(22px, 3.4vh, 34px); font-weight: 800; letter-spacing: 1px; }
    #hud .cine .cs { font-size: clamp(13px, 2vh, 17px); font-weight: 600; opacity: 0.85; margin-top: 2px; }
    #hud .cine .bar-b.in .ct, #hud .cine .bar-b.in .cs { animation: pop 0.6s ease; }
    #hud .cine .ck { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); display: flex; gap: 7px; align-items: center; font-size: 12px; opacity: 0.7; }
    #hud.filming .tl, #hud.filming .bl, #hud.filming .hints, #hud.filming .belt, #hud.filming .toasts, #hud.filming .banner { opacity: 0 !important; }

    /* Asleep */
    #hud .sleep { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: rgba(20, 26, 60, 0.55); opacity: 0; transition: opacity 0.8s ease; }
    #hud.asleep .sleep { opacity: 1; }
    #hud .sleep .zz { font-size: 46px; font-weight: 800; letter-spacing: 6px; animation: pulse 2.4s ease-in-out infinite; }
    #hud .sleep .sub { margin-top: 8px; }

    /* Start screen and pause menu: white words over the picture */
    #hud .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; transition: opacity 0.4s ease; text-align: center; }
    #hud .overlay.off { opacity: 0; pointer-events: none; }
    /* Hidden screens must not catch clicks: their buttons would otherwise still work while invisible. */
    #hud .overlay.off button, #hud .sheet.off button { pointer-events: none; }
    #hud .start { background: linear-gradient(rgba(30, 40, 70, 0.05), rgba(30, 40, 70, 0.22)); }
    #hud h1 { margin: 0; font-size: clamp(48px, 9vw, 96px); font-weight: 800; letter-spacing: -1px; line-height: 0.95; transform: rotate(-2deg); text-shadow: 0 3px 0 rgba(20, 20, 40, 0.18), var(--shade); }
    #hud .start .sub { margin: 14px 0 60px; font-size: 22px; font-weight: 700; letter-spacing: 3px; }
    #hud .start .sub { margin-bottom: 34px !important; }
    #hud .start .word.go { font-size: 34px; opacity: 1; }
    #hud .start .what { margin: 0 0 16px; font-size: 14px; font-weight: 600; opacity: 0.85; }
    #hud .start .press { margin-top: 18px; font-size: 14px; }
    #hud .press { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 1.5px; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.45; } }
    #hud .menu { background: rgba(30, 36, 60, 0.38); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); gap: 4px; }
    #hud .menu h2 { margin: 0 0 18px; font-size: 52px; font-weight: 800; transform: rotate(-2deg); }
    #hud .word { font-size: 25px; font-weight: 800; letter-spacing: 1.2px; padding: 7px 18px; opacity: 0.88; transition: transform 0.15s ease, opacity 0.15s ease; }
    #hud .word:hover { opacity: 1; transform: scale(1.1) rotate(-1.5deg); }
    #hud .word.small { font-size: 16px; padding: 4px 9px; }
