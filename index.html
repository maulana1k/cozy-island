<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scout Camp Island</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%236fcfd0'/%3E%3Cellipse cx='16' cy='19' rx='10' ry='6' fill='%239fd68a'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #1f2933; --soft: #5b6672; --line: rgba(31, 41, 51, 0.1);
      --glass: rgba(255, 255, 255, 0.62); --glass-strong: rgba(255, 255, 255, 0.82);
      --accent: #2f9e6f; --gold: #f5b301;
      --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, sans-serif;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8f2; }
    #game { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #game:active { cursor: grabbing; }

    /* Everything on screen sits on the same white frosted glass. */
    .glass, .pill-chip {
      background: var(--glass); color: var(--ink);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 8px 28px rgba(20, 40, 60, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    }
    kbd {
      font: 700 12px var(--font); color: var(--ink); background: #fff; border-radius: 7px; padding: 3px 7px;
      box-shadow: 0 1.5px 0 rgba(31, 41, 51, 0.22), 0 0 0 1px var(--line); white-space: nowrap;
    }

    /* Interact prompt and the controls hint, bottom centre */
    .pill-chip {
      position: fixed; left: 50%; transform: translateX(-50%); font: 600 15px/1 var(--font);
      padding: 9px 16px 9px 10px; border-radius: 999px; display: flex; align-items: center; gap: 9px;
      pointer-events: none; user-select: none; white-space: nowrap; transition: opacity 0.25s ease;
    }
    #prompt { bottom: 84px; opacity: 0; }
    #prompt kbd { font-size: 14px; padding: 5px 10px; background: var(--ink); color: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); }
    #hint { bottom: 26px; font-size: 13px; font-weight: 500; color: var(--soft); gap: 14px; padding: 8px 14px; }
    #hint span { display: inline-flex; align-items: center; gap: 6px; }
    .hidden { opacity: 0 !important; }

    #hud { position: fixed; inset: 0; pointer-events: none; color: var(--ink); font: 500 14px/1.3 var(--font); }
    #hud button { font: inherit; color: inherit; cursor: pointer; pointer-events: auto; }
    #hud svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
    #hud svg.fill { fill: currentColor; stroke: none; }
    #hud .ico { width: 18px; height: 18px; flex: none; display: inline-block; }
    #hud .gold { color: var(--gold); }
    #hud .soft { color: var(--soft); font-weight: 500; }
    #hud .left, #hud .right, #hud .ground, #hud .toasts { opacity: 0; transition: opacity 0.6s ease, transform 0.35s ease; }
    #hud.playing .left, #hud.playing .right, #hud.playing .ground, #hud.playing .toasts { opacity: 1; }

    /* Scout card: rank, progress, and the clock chips below it */
    #hud .left { position: absolute; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; }
    #hud .scout { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 20px; min-width: 250px; }
    #hud .ring { width: 50px; height: 50px; border-radius: 50%; background: #fff; display: grid; place-items: center; position: relative; box-shadow: 0 2px 8px rgba(20, 40, 60, 0.12); flex: none; }
    #hud .ring .ico { width: 44px; height: 44px; }
    #hud .ring .num { position: absolute; font-weight: 800; font-size: 15px; color: #6b4a00; top: 50%; left: 50%; transform: translate(-50%, -46%); }
    #hud .who { flex: 1; min-width: 0; }
    #hud .rank { font-weight: 800; font-size: 16px; letter-spacing: 0.1px; }
    #hud .bar { height: 7px; border-radius: 99px; background: rgba(31, 41, 51, 0.12); overflow: hidden; margin: 5px 0 4px; }
    #hud .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #36b37e, #7ad6a5); transition: width 0.6s cubic-bezier(.2, .9, .3, 1); }
    #hud .next { font-size: 11.5px; color: var(--soft); }
    #hud .chips { display: flex; gap: 6px; }
    #hud .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px 6px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    #hud .chip .ico { width: 15px; height: 15px; color: #e09b12; }
    #hud .chip.night .ico { color: #5d6fd1; }
    #hud .chip .time { font-size: 13.5px; }

    /* Buttons and minimap */
    #hud .right { position: absolute; top: 16px; right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    #hud .buttons { display: flex; gap: 8px; }
    #hud .round { width: 42px; height: 42px; border-radius: 14px; padding: 10px; position: relative; transition: transform 0.12s ease, background 0.15s ease; }
    #hud .round:hover { transform: translateY(-1px) scale(1.04); background: var(--glass-strong); }
    #hud .round .hot { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); font-size: 9px; padding: 1px 4px; border-radius: 5px; }
    #hud .round.muted { color: #b0b7bf; }
    #hud .round.muted .waves { display: none; }
    #hud .round .dot { position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--gold); border: 2px solid #fff; transform: scale(0); transition: transform 0.25s cubic-bezier(.2, 1.6, .4, 1); }
    #hud .round .dot.on { transform: scale(1); }
    #hud .map { position: relative; width: 164px; height: 164px; border-radius: 50%; padding: 5px; }
    #hud .map canvas { display: block; border-radius: 50%; }
    #hud .north { position: absolute; top: -4px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 800; background: #fff; border-radius: 999px; padding: 0 6px; box-shadow: 0 1px 4px rgba(20, 40, 60, 0.2); }
    #hud.journal .map { opacity: 0; }

    /* What you are standing on */
    #hud .ground { position: absolute; left: 16px; bottom: 22px; }
    #hud .swatch { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px #fff; transition: background 0.3s ease; }

    /* Discovery pop-ups */
    #hud .toasts { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; }
    #hud .toast { display: flex; align-items: center; gap: 11px; padding: 9px 16px 9px 11px; border-radius: 18px; background: var(--glass-strong);
      animation: pop 0.45s cubic-bezier(.2, 1.5, .4, 1); transition: opacity 0.5s ease, transform 0.5s ease; }
    #hud .toast .ico { width: 30px; height: 30px; animation: spin 0.7s cubic-bezier(.2, 1.3, .4, 1); }
    #hud .toast .small, #hud .banner .small { font-size: 10.5px; font-weight: 800; letter-spacing: 0.9px; text-transform: uppercase; color: var(--accent); }
    #hud .toast .label { font-weight: 700; font-size: 15px; }
    #hud .toast .count { margin-left: 6px; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
    #hud .toast.out { opacity: 0; transform: translateY(-10px); }
    @keyframes pop { from { opacity: 0; transform: translateY(-14px) scale(0.85); } to { opacity: 1; transform: none; } }
    @keyframes spin { from { transform: rotate(-120deg) scale(0.2); } to { transform: none; } }
    #hud .banner { position: absolute; top: 24%; left: 50%; transform: translate(-50%, -20px) scale(0.9); opacity: 0; display: flex; align-items: center; gap: 16px;
      padding: 16px 28px; border-radius: 26px; background: var(--glass-strong); text-align: center; transition: opacity 0.45s ease, transform 0.55s cubic-bezier(.2, 1.4, .4, 1); }
    #hud .banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
    #hud .banner .ico { width: 34px; height: 34px; }
    #hud .banner .big { font-size: 28px; font-weight: 800; }

    /* Journal side bar */
    #hud .drawer { position: absolute; top: 76px; right: 16px; bottom: 16px; width: 330px; max-width: calc(100vw - 32px); border-radius: 24px; display: flex; flex-direction: column;
      pointer-events: auto; background: var(--glass-strong); transform: translateX(calc(100% + 24px)); transition: transform 0.4s cubic-bezier(.2, .9, .3, 1); overflow: hidden; }
    #hud.journal .drawer { transform: none; }
    #hud .drawer .head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px 18px; }
    #hud .drawer .head .ico { width: 22px; height: 22px; color: var(--accent); }
    #hud .drawer h2 { margin: 0; font-size: 18px; font-weight: 800; flex: 1; }
    #hud .drawer .x { width: 30px; height: 30px; padding: 7px; border: 0; border-radius: 10px; background: rgba(31, 41, 51, 0.07); }
    #hud .drawer .x:hover { background: rgba(31, 41, 51, 0.14); }
    #hud .summary { margin: 0 16px 6px; padding: 12px 14px; border-radius: 16px; background: #fff; box-shadow: 0 1px 0 var(--line); }
    #hud .summary .rank { font-size: 14px; }
    #hud .lists { flex: 1; overflow-y: auto; padding: 4px 16px 8px; }
    #hud .lists h3 { display: flex; justify-content: space-between; margin: 14px 2px 6px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: var(--soft); }
    #hud .item { display: flex; gap: 11px; align-items: center; padding: 8px 10px; border-radius: 13px; }
    #hud .item + .item { margin-top: 2px; }
    #hud .item .mark { width: 24px; height: 24px; border-radius: 50%; border: 2px dashed rgba(31, 41, 51, 0.22); flex: none; padding: 3px; box-sizing: border-box; }
    #hud .item .label { font-weight: 650; font-size: 13.5px; }
    #hud .item .hint { font-size: 11.5px; color: var(--soft); }
    #hud .item.done { background: rgba(54, 179, 126, 0.12); }
    #hud .item.done .mark { border: 0; background: #fff; color: var(--gold); padding: 3px; box-shadow: 0 1px 4px rgba(20, 40, 60, 0.15); }
    #hud .item.done .hint { color: var(--accent); font-weight: 700; }
    #hud .foot { padding: 10px 18px 14px; font-size: 11.5px; color: var(--soft); border-top: 1px solid var(--line); }

    /* Start screen and pause menu */
    #hud .overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: auto; background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity 0.35s ease; }
    #hud .overlay.start { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px); }
    #hud .overlay.off { opacity: 0; pointer-events: none; }
    #hud .panel { border-radius: 30px; padding: 30px 40px 32px; text-align: center; max-width: min(92vw, 470px); background: var(--glass-strong); }
    #hud .panel.wide { width: min(92vw, 440px); max-height: 92vh; overflow: auto; padding: 26px 28px; }
    #hud .huge { width: 54px; height: 54px; margin: 0 auto 6px; display: block; }
    #hud h1 { margin: 0 0 8px; font-size: 40px; font-weight: 800; letter-spacing: -0.6px; }
    #hud .panel h2 { margin: 0 0 16px; font-size: 26px; font-weight: 800; }
    #hud .panel h3 { margin: 18px 0 8px; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--soft); text-align: left; }
    #hud .sub { margin: 0 0 22px; font-size: 15px; color: var(--soft); }
    #hud .press { margin: 0; font-weight: 700; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    #hud .btn { display: block; width: 100%; padding: 12px; margin: 0 0 8px; border: 0; border-radius: 14px; font-size: 15px; font-weight: 700; background: rgba(31, 41, 51, 0.07); transition: transform 0.12s ease, background 0.15s ease; }
    #hud .btn:hover { transform: translateY(-1px); background: rgba(31, 41, 51, 0.12); }
    #hud .btn.primary { background: var(--ink); color: #fff; }
    #hud .btn.primary:hover { background: #33414f; }
    #hud .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; margin: 14px 0 0; }
    #hud .row .label { font-weight: 700; width: 100%; font-size: 12.5px; color: var(--soft); }
    #hud .pill { padding: 6px 12px; border: 0; border-radius: 999px; font-size: 13px; font-weight: 600; background: rgba(31, 41, 51, 0.07); }
    #hud .pill:hover { background: rgba(31, 41, 51, 0.14); }
    #hud .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; text-align: left; }
    #hud .key { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    @media (max-width: 720px) { #hud .map { display: none; } #hud .scout { min-width: 0; } #hud .chips { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="prompt" class="pill-chip"></div>
  <div id="hint" class="pill-chip hidden"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
